<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2eee4">
<title>山水的回响 · Echoes of Landscape</title>
<meta name="description" content="一件由风与墨构成的生成艺术海报：1200 颗粒子沿 Perlin 风场漂移成远山，鼠标扰动风场，点击荡开回声。">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2eee4; }
  body { -webkit-tap-highlight-color: transparent; font-family: "Songti SC", SimSun, STSong, serif; }
  canvas { display: block; }

  #dock {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,0.10);
    z-index: 10;
    opacity: 0.55;
    transition: opacity .25s;
    user-select: none;
  }
  #dock:hover { opacity: 1; }
  #dock button {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 12px;
    letter-spacing: .04em;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .2s;
  }
  #dock button:hover { background: rgba(0,0,0,0.08); }
  #dock button:active { background: rgba(0,0,0,0.16); }
  #dock .sep { width: 1px; background: currentColor; opacity: .18; margin: 4px 2px; }
  @media (max-width: 560px) {
    #dock { bottom: 10px; opacity: .9; }
    #dock button { font-size: 11px; padding: 7px 9px; }
  }

  #fallback { position: fixed; inset: 0; display: none; place-items: center; font: 15px/1.8 system-ui, sans-serif; color: #26302b; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div id="fallback">你的浏览器暂时无法运行此页面所需的图形功能。<br>请尝试更新浏览器，或在桌面端打开。</div>

<div id="dock" role="group" aria-label="配色与保存">
  <button type="button" data-palette="0">一 · 玄墨</button>
  <button type="button" data-palette="1">二 · 青瓷</button>
  <button type="button" data-palette="2">三 · 夜金</button>
  <div class="sep"></div>
  <button type="button" data-save="1">保存 PNG</button>
</div>

<script src="./p5.min.js"></script>
<script>
  window.addEventListener('error', function () {
    document.getElementById('fallback').style.display = 'grid';
  });
</script>
<script src="./sketch.js"></script>
</body>
</html>
